<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Inside the Case</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: service-manual workbench — a cutaway schematic of the case on the left, the reference sheet for whatever you touch on the right. */
:root {
  --bg: #EDF0F3;
  --surface: #FFFFFF;
  --ink: #132030;
  --muted: #5A6777;
  --line: #CDD4DC;
  --copper: #B4561F;
  --copper-soft: #F4E3D7;
  --signal: #1C6AD0;
  --signal-soft: #DDE9F8;
  --good: #23824F;
  --bad: #B83A3A;

  --case: #DDE3E9;
  --case-deep: #CFD6DE;
  --board: #C7D5CE;
  --trace: #A9BDB3;
  --comp: #445366;
  --comp-2: #5C6C80;
  --metal: #9AA6B3;
  --chip: #26313E;
  --label-halo: #DDE3E9;

  --f-display: "Chakra Petch", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1319; --surface: #151C24; --ink: #E5EAF0; --muted: #93A0AF; --line: #2A3542;
    --copper: #E68A50; --copper-soft: #3A2619; --signal: #5EA4FF; --signal-soft: #17283E;
    --good: #4CC583; --bad: #F07272;
    --case: #1A222C; --case-deep: #141B23; --board: #1F2E2A; --trace: #2D4640;
    --comp: #3B4A5D; --comp-2: #4C5D72; --metal: #6B7887; --chip: #0B1016; --label-halo: #1A222C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1319; --surface: #151C24; --ink: #E5EAF0; --muted: #93A0AF; --line: #2A3542;
  --copper: #E68A50; --copper-soft: #3A2619; --signal: #5EA4FF; --signal-soft: #17283E;
  --good: #4CC583; --bad: #F07272;
  --case: #1A222C; --case-deep: #141B23; --board: #1F2E2A; --trace: #2D4640;
  --comp: #3B4A5D; --comp-2: #4C5D72; --metal: #6B7887; --chip: #0B1016; --label-halo: #1A222C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body {
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.app { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.app > * { min-width: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand { display: flex; gap: 14px; align-items: center; min-width: 0; }
.brand svg { flex: none; }
.brand h1 { font-size: 30px; font-weight: 700; line-height: 1.05; }
.brand p { color: var(--muted); font-size: 14px; }
.tabs-wrap { overflow-x: auto; max-width: 100%; min-width: 0; }
.tabs { display: inline-flex; gap: 2px; padding: 3px; background: var(--case); border: 1px solid var(--line); border-radius: 9px; }
.tab {
  border: 0; background: transparent; padding: 7px 13px; border-radius: 7px; cursor: pointer;
  font-family: var(--f-mono); font-size: 12.5px; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; color: var(--muted);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }

/* Stage */
.stage { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.figure { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); display: grid; gap: 10px; min-width: 0; }
.diagram-box { background: var(--case-deep); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
svg.diagram { display: block; width: 100%; height: auto; max-height: calc(100vh - 170px); touch-action: manipulation; }
.figbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.hoverline { font-size: 13.5px; color: var(--muted); min-height: 1.5em; min-width: 0; }
.hoverline b { color: var(--ink); font-weight: 600; }
.toggle { display: inline-flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); cursor: pointer; text-transform: uppercase; letter-spacing: .05em; }
.toggle input { accent-color: var(--copper); }

/* Diagram parts */
.part { cursor: pointer; transition: opacity .25s ease; }
.part:hover .hl, .part:focus-visible .hl { stroke: var(--copper); stroke-width: 2.5; }
.part:focus { outline: none; }
.diagram.dim .part:not(.is-on) { opacity: .38; }
.diagram.dim .cable:not(.is-on) { opacity: .15; }
.diagram[data-mode="heat"] .part[data-score="1"] { opacity: .16; }
.diagram[data-mode="heat"] .part[data-score="2"] { opacity: .34; }
.diagram[data-mode="heat"] .part[data-score="3"] { opacity: .6; }
.diagram[data-mode="heat"] .part[data-score="4"] { opacity: .85; }
.diagram[data-mode="heat"] .part[data-score="5"] { opacity: 1; }
.cable { pointer-events: none; fill: none; stroke: var(--metal); stroke-width: 5; stroke-linecap: round; opacity: .55; transition: opacity .25s, stroke .25s; }
.cable.is-on { stroke: var(--copper); opacity: 1; }
.lbl { font-family: var(--f-mono); font-size: 13px; font-weight: 500; fill: var(--ink); paint-order: stroke; stroke: var(--label-halo); stroke-width: 5px; stroke-linejoin: round; pointer-events: none; letter-spacing: .03em; }
.labels-off .lbl { display: none; }
.frame { fill: none; stroke: var(--copper); stroke-width: 2; stroke-dasharray: 7 5; pointer-events: none; }
.tick { fill: var(--copper); pointer-events: none; }
.flow { fill: none; stroke-width: 2; stroke-dasharray: 5 11; opacity: .7; animation: flow 1.6s linear infinite; pointer-events: none; }
.flow.cool { stroke: var(--signal); }
.flow.warm { stroke: var(--copper); }
.spin { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
.spin.fast { animation-duration: .9s; }
.packet { fill: var(--signal); }
.packet-ring { fill: none; stroke: var(--signal); stroke-width: 2; opacity: .45; }
@keyframes flow { to { stroke-dashoffset: -32; } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .flow, .spin { animation: none; }
}

/* Panels */
.panel { display: grid; gap: 18px; min-width: 0; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--copper); }
.part-head { display: grid; gap: 6px; }
.part-head h2 { font-size: 34px; font-weight: 700; line-height: 1.05; }
.analogy { font-size: 17px; color: var(--muted); max-width: 60ch; }
.analogy b { color: var(--ink); font-weight: 600; }
.section { display: grid; gap: 10px; }
.section h3 { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.how { display: grid; gap: 10px; max-width: 64ch; }
.how p { font-size: 15.5px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--f-mono); font-size: 12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--signal-soft); color: var(--signal); margin-top: 1px; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 9px 12px; vertical-align: top; border-bottom: 1px solid var(--line); }
tr:last-child td { border-bottom: 0; }
th { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink); font-size: 13.5px; }
td.m { color: var(--muted); min-width: 180px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer;
  display: inline-flex; gap: 6px; align-items: center;
}
.chip:hover { border-color: var(--copper); }
.chip small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.note { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: grid; gap: 6px; align-content: start; }
.note .k { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; }
.note.tip .k { color: var(--good); }
.note.myth .k { color: var(--copper); }
.note p { font-size: 14.5px; }
.note .myth-claim { text-decoration: line-through; text-decoration-color: var(--copper); color: var(--muted); }

.parts-index { display: flex; flex-wrap: wrap; gap: 6px; }
.parts-index .chip[aria-current="true"] { background: var(--copper); border-color: var(--copper); color: #fff; }

/* Journey */
.journey-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 14px; }
.journey-card h2 { font-size: 28px; font-weight: 700; line-height: 1.1; }
.journey-card .body { font-size: 16px; max-width: 60ch; }
.fact { font-family: var(--f-mono); font-size: 13px; color: var(--signal); background: var(--signal-soft); border-radius: 8px; padding: 8px 11px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dot { width: 26px; height: 6px; border-radius: 3px; background: var(--line); border: 0; cursor: pointer; padding: 0; }
.dot[aria-current="true"] { background: var(--signal); }
.timeline { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.timeline button { width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px; cursor: pointer; display: grid; grid-template-columns: 56px 1fr; gap: 10px; font-size: 14px; color: var(--muted); }
.timeline button:hover { background: var(--case); color: var(--ink); }
.timeline button[aria-current="true"] { background: var(--signal-soft); color: var(--ink); }
.timeline .t { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; padding-top: 1px; }

/* Priorities */
.uses { display: flex; flex-wrap: wrap; gap: 6px; }
.prio { display: grid; gap: 4px; }
.prio-row { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.prio-row:hover .pn { color: var(--copper); }
.pn { font-weight: 500; font-size: 14.5px; }
.pips { display: flex; gap: 4px; align-items: center; min-width: 0; }
.pip { width: 22px; height: 10px; border-radius: 2px; background: var(--line); flex: none; }
.pip.on { background: var(--copper); }
.pips .why { font-size: 13px; color: var(--muted); margin-left: 8px; min-width: 0; }
.summary { font-size: 16.5px; max-width: 62ch; }

/* Full-width views */
.wide { display: grid; gap: 20px; max-width: 980px; }
.wide h2 { font-size: 32px; font-weight: 700; line-height: 1.08; }
.lede { font-size: 16.5px; color: var(--muted); max-width: 66ch; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 14px; overflow-x: auto; }
.chart-inner { min-width: 620px; display: grid; gap: 0; }
.crow { display: grid; grid-template-columns: 180px 1fr 140px; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.crow:last-of-type { border-bottom: 0; }
.crow .name { font-weight: 500; font-size: 14.5px; }
.crow .name small { display: block; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.track { position: relative; height: 22px; }
.track .grid { position: absolute; top: -8px; bottom: -8px; width: 1px; background: var(--line); }
.bar { position: absolute; left: 0; top: 4px; height: 14px; border-radius: 0 3px 3px 0; background: var(--signal); min-width: 4px; }
.bar.slow { background: var(--copper); }
.bar::after { content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 20px; border-radius: 2px; background: inherit; }
.human { font-family: var(--f-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; text-align: right; }
.axis { display: grid; grid-template-columns: 180px 1fr 140px; gap: 14px; padding-top: 6px; }
.axis .scale { position: relative; height: 18px; }
.axis .scale span { position: absolute; transform: translateX(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
.footnote { font-size: 13px; color: var(--muted); max-width: 72ch; }

/* Quiz */
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 16px; max-width: 760px; }
.qmeta { display: flex; justify-content: space-between; gap: 10px; font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--copper); transition: width .3s; }
.quiz h3 { font-size: 22px; font-weight: 600; line-height: 1.25; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 9px; padding: 11px 14px; cursor: pointer; font-size: 15px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.opt .letter { font-family: var(--f-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--surface)); }
.explain { border-left: 3px solid var(--signal); padding: 4px 0 4px 12px; font-size: 15px; }
.explain b { font-weight: 600; }
.score-big { font-family: var(--f-display); font-size: 56px; font-weight: 700; line-height: 1; }

@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .figure { position: static; }
  svg.diagram { max-height: 62vh; }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 25px; }
  .part-head h2 { font-size: 28px; }
  .prio-row { grid-template-columns: 100px 1fr; }
  .pips .why { display: none; }
  .journey-card { padding: 16px; }
  .quiz { padding: 16px; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="9" y="9" width="26" height="26" rx="3" fill="var(--chip)"/>
        <rect x="15" y="15" width="14" height="14" rx="1.5" fill="var(--copper)"/>
        <g stroke="var(--muted)" stroke-width="2" stroke-linecap="round">
          <path d="M15 3v5M22 3v5M29 3v5M15 36v5M22 36v5M29 36v5M3 15h5M3 22h5M3 29h5M36 15h5M36 22h5M36 29h5"/>
        </g>
      </svg>
      <div>
        <h1>Inside the Case</h1>
        <p>How every part of a PC works, and how they work together</p>
      </div>
    </div>
    <div class="tabs-wrap">
      <nav class="tabs" role="tablist" aria-label="Sections">
        <button class="tab" role="tab" data-view="explore" aria-selected="true">Explore parts</button>
        <button class="tab" role="tab" data-view="journey" aria-selected="false">Data journey</button>
        <button class="tab" role="tab" data-view="speed" aria-selected="false">Speed scale</button>
        <button class="tab" role="tab" data-view="priorities" aria-selected="false">What matters</button>
        <button class="tab" role="tab" data-view="quiz" aria-selected="false">Quiz</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="stage" id="stage">
      <div class="figure">
        <div class="diagram-box">
          <svg class="diagram" id="diagram" viewBox="0 0 760 820" role="group" aria-label="Cutaway of a desktop PC. Select a part to learn how it works.">
            <!-- case shell -->
            <rect x="8" y="8" width="744" height="804" rx="18" fill="var(--case)" stroke="var(--line)" stroke-width="2"/>
            <rect x="22" y="604" width="716" height="196" rx="8" fill="var(--case-deep)"/>
            <text x="34" y="596" class="lbl" style="font-size:11px;fill:var(--muted)">PSU SHROUD</text>

            <!-- airflow -->
            <path class="flow cool" d="M598 130 C520 140, 470 120, 360 150"/>
            <path class="flow cool" d="M598 300 C540 300, 520 290, 480 285"/>
            <path class="flow cool" d="M598 470 C590 480, 585 490, 575 500"/>
            <path class="flow warm" d="M170 90 C120 90, 80 100, 40 110"/>
            <path class="flow warm" d="M170 150 C120 150, 80 140, 40 140"/>

            <!-- motherboard -->
            <g class="part" data-part="motherboard" tabindex="0" role="button" aria-label="Motherboard">
              <rect class="hl" x="60" y="40" width="440" height="530" rx="6" fill="var(--board)" stroke="var(--trace)" stroke-width="1.5"/>
              <g stroke="var(--trace)" stroke-width="1.4" fill="none">
                <path d="M120 290 H350 V340"/><path d="M130 284 H356 V338"/>
                <path d="M340 190 H362"/><path d="M340 200 H362"/><path d="M340 210 H362"/><path d="M340 220 H362"/>
                <path d="M300 280 V292"/><path d="M420 470 V488"/><path d="M430 470 V488"/>
                <path d="M200 480 H380 V505"/><path d="M200 490 H372"/>
                <path d="M100 540 H470"/><path d="M110 550 H460"/>
              </g>
              <g fill="var(--trace)">
                <circle cx="76" cy="56" r="5"/><circle cx="484" cy="56" r="5"/><circle cx="76" cy="554" r="5"/><circle cx="484" cy="554" r="5"/><circle cx="350" cy="56" r="5"/><circle cx="350" cy="554" r="5"/>
              </g>
              <!-- rear I/O -->
              <rect id="io" x="60" y="56" width="34" height="200" rx="2" fill="var(--comp)"/>
              <g fill="var(--metal)"><rect x="66" y="70" width="22" height="12" rx="2"/><rect x="66" y="90" width="22" height="12" rx="2"/><rect x="66" y="110" width="22" height="12" rx="2"/><rect x="66" y="134" width="22" height="18" rx="2"/><rect x="66" y="162" width="22" height="12" rx="2"/><rect x="66" y="182" width="22" height="12" rx="2"/><circle cx="77" cy="214" r="5"/><circle cx="77" cy="232" r="5"/></g>
              <!-- VRM heatsinks -->
              <rect x="110" y="60" width="160" height="26" rx="3" fill="var(--comp-2)"/>
              <rect x="110" y="94" width="40" height="150" rx="3" fill="var(--comp-2)"/>
              <!-- DIMM slots -->
              <g fill="var(--comp)"><rect x="366" y="66" width="20" height="268" rx="2"/><rect x="384" y="66" width="20" height="268" rx="2"/><rect x="402" y="66" width="20" height="268" rx="2"/><rect x="420" y="66" width="20" height="268" rx="2"/></g>
              <!-- 24-pin -->
              <rect id="atx24" x="468" y="150" width="20" height="110" rx="2" fill="var(--comp)"/>
              <!-- PCIe slots -->
              <rect x="110" y="352" width="300" height="10" rx="2" fill="var(--comp)"/>
              <rect x="110" y="508" width="230" height="9" rx="2" fill="var(--comp)"/>
              <!-- SATA ports -->
              <g fill="var(--comp)"><rect x="476" y="420" width="16" height="12" rx="1"/><rect x="476" y="438" width="16" height="12" rx="1"/><rect x="476" y="456" width="16" height="12" rx="1"/></g>
            </g>

        <button class="prio-row" data-goto="${k}">
          <span class="pn">${esc(PARTS[k].name)}</span>
          <span class="pips" aria-label="${u.s[k]} out of 5">${[1, 2, 3, 4, 5].map((n) => `<span class="pip ${n <= u.s[k] ? "on" : ""}"></span>`).join("")}${u.why[k] ? `<span class="why">${esc(u.why[k])}</span>` : ""}</span>
        </button>`).join("")}</div>
      <p class="footnote">The cutaway fades each part by how much it matters for this kind of use. Select a row to read about that part.</p>`;
    $$(".part", svg).forEach((p) => p.dataset.score = u.s[p.dataset.part] || 1);
    setFrames(sorted.slice(0, 2));
  }

  /* ---------------- Speed ---------------- */
  function human(sec) {
    const U = [["year", 31557600], ["month", 2629800], ["day", 86400], ["hour", 3600], ["minute", 60], ["second", 1]];
    for (const [n, v] of U) if (sec >= v * 0.95) { const q = sec / v; const r = q >= 10 ? Math.round(q) : Math.round(q * 10) / 10; return r + " " + n + (r === 1 ? "" : "s"); }
    return sec.toFixed(1) + " s";
  }
  function renderSpeed() {
    const base = SPEED[0].ns;
    const LO = -0.2, HI = 9;
    const pos = (sec) => ((Math.log10(sec) - LO) / (HI - LO)) * 100;
    const ticks = [["1 sec", 1], ["1 min", 60], ["1 hour", 3600], ["1 day", 86400], ["1 month", 2629800], ["1 year", 31557600], ["10 years", 315576000]];
    const grid = ticks.map(([, v]) => `<span class="grid" style="left:${pos(v)}%"></span>`).join("");
    const rows = SPEED.map((r) => {
      const sec = r.ns / base;
      return `<div class="crow"><div class="name">${esc(r.name)}<small>${esc(r.real)}</small></div>
        <div class="track">${grid}<span class="bar ${sec > 1000 ? "slow" : ""}" style="width:${Math.max(0.6, pos(sec))}%"></span></div>
        <div class="human">${human(sec)}</div></div>`;
    }).join("");
    $("#view-speed").innerHTML = `
      <span class="eyebrow">Speed scale</span>
      <h2>If one CPU tick lasted a second</h2>
      <p class="lede">Computers wait on data far more than they compute. Stretch time so a single 0.3-nanosecond clock cycle lasts one second, and you can see why the parts are arranged in layers from fast-and-small to slow-and-huge.</p>
      <div class="chart"><div class="chart-inner">
        <div class="axis" style="padding:0 0 4px"><span class="name" style="position:static;transform:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Where the data lives</span><span></span><span style="position:static;transform:none;text-align:right;font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">At human scale</span></div>
        ${rows}
        <div class="axis"><span></span><div class="scale">${ticks.map(([l, v]) => `<span style="left:${pos(v)}%">${l}</span>`).join("")}</div><span></span></div>
      </div></div>
      <div class="notes">
        <div class="note tip"><span class="k">Why cache exists</span><p>A trip to RAM would leave the CPU idle for over 4 minutes of human time. Three layers of on-chip cache keep the data it's most likely to need within a few seconds' reach.</p></div>
        <div class="note tip"><span class="k">Why SSDs felt like magic</span><p>Swapping a hard disk for an SSD cuts a 10-month wait down to about 2 days. That jump is why an SSD upgrade makes an old PC feel new.</p></div>
      </div>
      <p class="footnote">Log scale: each gridline is a bigger unit of time, not an equal step. Latencies are typical round figures for a modern desktop at about 3.3 GHz. Real numbers vary by model and workload.</p>`;
  }

  /* ---------------- Quiz ---------------- */
  let qi = 0, score = 0, answered = false;
  function renderQuiz() {
    const v = $("#view-quiz");
    if (qi >= QUIZ.length) {
      const pct = Math.round((score / QUIZ.length) * 100);
      const verdict = pct === 100 ? "Perfect. You could build one blindfolded." : pct >= 70 ? "Solid. You know your way around a case." : pct >= 40 ? "Good start. The Explore tab fills the gaps." : "Have a browse through the parts, then try again.";
      v.innerHTML = `<span class="eyebrow">Quiz</span><h2>How well do you know the box?</h2>
        <div class="quiz"><span class="qmeta"><span>Final score</span><span>${pct}%</span></span>
        <div class="score-big">${score} / ${QUIZ.length}</div><p style="font-size:17px">${verdict}</p>
        <div class="controls"><button class="btn primary" id="q-restart">Try again</button><button class="btn" data-view-go="explore">Explore the parts</button></div></div>`;
      return;
    }
    const q = QUIZ[qi];
    v.innerHTML = `<span class="eyebrow">Quiz</span><h2>How well do you know the box?</h2>
      <div class="quiz">
        <div class="qmeta"><span>Question ${qi + 1} of ${QUIZ.length}</span><span>Score ${score}</span></div>
        <div class="progress"><div style="width:${(qi / QUIZ.length) * 100}%"></div></div>
        <h3>${esc(q.q)}</h3>
        <div class="opts">${q.o.map((o, i) => `<button class="opt" data-opt="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
        <div id="q-after" hidden></div>
      </div>`;
    answered = false;
  }
  function answer(i) {
    if (answered) return;
    answered = true;
    const q = QUIZ[qi];
    if (i === q.a) score++;
    $$(".opt").forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add("right"); else if (k === i) b.classList.add("wrong"); });
    const after = $("#q-after");
    after.hidden = false;
    after.innerHTML = `<div style="display:grid;gap:14px"><p class="explain">${i === q.a ? "Correct. " : "Not quite. "}${q.e}</p>
      <div class="controls"><button class="btn primary" id="q-next">${qi === QUIZ.length - 1 ? "See score" : "Next question"}</button></div></div>`;
    $("#q-next").focus();
    $(".qmeta span:last-child").textContent = "Score " + score;
  }

  /* ---------------- Views ---------------- */
  const VIEWS = ["explore", "journey", "speed", "priorities", "quiz"];
  let view = "explore";
  function show(v, opts) {
    opts = opts || {};
    view = v;
    $$(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.view === v)));
    const onStage = ["explore", "journey", "priorities"].includes(v);
    $("#stage").hidden = !onStage;
    $("#panel-explore").hidden = v !== "explore";
    $("#panel-journey").hidden = v !== "journey";
    $("#panel-priorities").hidden = v !== "priorities";
    $("#view-speed").hidden = v !== "speed";
    $("#view-quiz").hidden = v !== "quiz";
    svg.dataset.mode = v === "priorities" ? "heat" : "";
    if (v !== "journey") { stopPacket(); playing = false; clearInterval(playTimer); $$(".cable", svg).forEach((c) => c.classList.remove("is-on")); }
    if (v === "explore") renderExplore(opts.part || current, opts.scroll);
    if (v === "journey") renderJourney();
    if (v === "priorities") { setOn([], false); renderPriorities(); }
    if (v === "speed") renderSpeed();
    if (v === "quiz") renderQuiz();
    try { history.replaceState(null, "", "#" + (v === "explore" ? (opts.part || current) : v)); } catch (e) {}
  }

  /* ---------------- Events ---------------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("button, .part");
    if (!t) return;
    if (t.classList.contains("tab")) return show(t.dataset.view);
    if (t.classList.contains("part")) return show("explore", { part: t.dataset.part, scroll: true });
    if (t.dataset.goto) return show("explore", { part: t.dataset.goto, scroll: view !== "explore" ? false : true });
    if (t.dataset.viewGo) return show(t.dataset.viewGo);
    if (t.dataset.use) { use = t.dataset.use; return renderPriorities(); }
    if (t.dataset.step) { playing = false; clearInterval(playTimer); return goStep(+t.dataset.step); }
    if (t.id === "j-prev") { playing = false; clearInterval(playTimer); return goStep(step - 1); }
    if (t.id === "j-next") { playing = false; clearInterval(playTimer); return goStep(step + 1); }
    if (t.id === "j-play") return togglePlay();
    if (t.dataset.opt) return answer(+t.dataset.opt);
    if (t.id === "q-next") { qi++; return renderQuiz(); }
    if (t.id === "q-restart") { qi = 0; score = 0; return renderQuiz(); }
  });
  svg.addEventListener("keydown", (e) => {
    const p = e.target.closest(".part");
    if (p && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show("explore", { part: p.dataset.part, scroll: true }); }
  });
  const hover = $("#hoverline");
  const defaultHover = "Tap any part of the cutaway.";
  $$(".part", svg).forEach((p) => {
    const info = () => { const d = PARTS[p.dataset.part]; hover.innerHTML = `<b>${esc(d.name)}</b> · ${esc(d.analogy.replace(/<[^>]+>/g, "").split(".")[0])}.`; };
    p.addEventListener("pointerenter", info);
    p.addEventListener("focus", info);
    p.addEventListener("pointerleave", () => { hover.textContent = defaultHover; });
    p.addEventListener("blur", () => { hover.textContent = defaultHover; });
  });
  $("#labels-toggle").addEventListener("change", (e) => svg.classList.toggle("labels-off", !e.target.checked));

  /* ---------------- Boot ---------------- */
  const h = (location.hash || "").slice(1);
  if (PARTS[h]) show("explore", { part: h });
  else if (VIEWS.includes(h)) show(h);
  else show("explore", { part: "cpu" });
})();
</script>

</body>
</html>
